name: PHP Syntax Check

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**.php'
      - '.github/workflows/php-lint.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - '**.php'

jobs:
  php-lint:
    runs-on: ubuntu-latest
    name: PHP Syntax Validation

    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo, mysql

      - name: Check PHP files syntax
        run: |
          echo "🔍 Checking PHP syntax..."
          find . -name "*.php" -type f ! -path "./.git/*" ! -path "./node_modules/*" | while read file; do
            php -l "$file" || exit 1
          done
          echo "✅ All PHP files have valid syntax"

      - name: Run PHP-CS-Fixer (if installed)
        continue-on-error: true
        run: |
          if command -v php-cs-fixer &> /dev/null; then
            echo "🔧 Running PHP-CS-Fixer..."
            php-cs-fixer fix --dry-run --diff
          fi

  lint-failure:
    runs-on: ubuntu-latest
    if: failure()
    needs: php-lint
    steps:
      - uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ PHP syntax check failed. Please fix the errors and push again.'
            })
